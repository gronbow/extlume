name: Monitor compatibility report
description: Report whether a monitor/cable/dock combination uses hardware or software control.
title: "[Compatibility] "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Thank you for expanding the hardware matrix.
        Never post an EDID serial number or a raw `\\?\DISPLAY#...` device path.

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.2.0-beta.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 24H2, x64
    validations:
      required: true

  - type: input
    id: computer
    attributes:
      label: Laptop/PC and GPU model
      placeholder: Lenovo ..., Intel/NVIDIA/AMD ...
    validations:
      required: true

  - type: input
    id: monitor
    attributes:
      label: Monitor model shown by the app
      placeholder: H25T7-3
    validations:
      required: true

  - type: textarea
    id: connection
    attributes:
      label: Complete connection path
      placeholder: Laptop USB-C → dock model → DisplayPort cable → monitor
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Detected result
      options:
        - Hardware · DDC/CI works
        - Hardware · DDC/CI is detected but write fails
        - Software dimming works
        - Duplicate mode is protected; Extend is required
        - Monitor is not detected
        - Wrong model or wrong display is shown
    validations:
      required: true

  - type: dropdown
    id: topology
    attributes:
      label: Windows display mode
      options:
        - Extend
        - Duplicate / mirror
        - Second screen only
        - Other
    validations:
      required: true

  - type: textarea
    id: observations
    attributes:
      label: Observations
      description: Include requested and verified percentages if hardware control works.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include a serial number or raw Windows device path.
          required: true
