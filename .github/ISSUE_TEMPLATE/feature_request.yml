name: Feature request
description: Suggest a focused improvement that preserves the app's safety and privacy model.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user problem rather than only the proposed UI.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: The request does not require arbitrary VCP commands or monitor reset.
          required: true
        - label: The request does not require telemetry, an account, or administrator rights.
          required: true
